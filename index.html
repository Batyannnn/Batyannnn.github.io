
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 09</title>

    <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: 20px auto;
            padding: 10px;
            box-shadow: 0 0 15px gray;
        }

        /* First Hello World */
        .box1 {
            background-color: skyblue;
            border: 8px double tomato;
            padding: 5px;
            margin: 12px 0 22px;
        }

        /* Second Hello World */
        .box2 {
            background-color: yellow;
            border: 3px solid dodgerblue;
            border-radius: 12px;
            padding: 5px;
            margin: 22px 0;
        }

        /* Third Hello World */
        .box3 {
            background-color: mediumseagreen;
            border: 10px dotted gray;
            padding: 5px;
            margin: 22px 0 8px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            color: black;
            margin: 0;
        }

        .note {
            color: red;
            font-size: 24px;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1">
            <h1>Hello World</h1>
        </div>

        <div class="box2">
            <h1>Hello World</h1>
        </div>

        <div class="box3">
            <h1>Hello World</h1>
        </div>

    </div>



</body>
</html>
